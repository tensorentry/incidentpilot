# Local services (spec D03). PostgreSQL publishes no port here, so only containers on
# the private network can reach it. docker-compose.dev.yml publishes it on loopback.
name: incidentpilot

services:
  postgres:
    # PostgreSQL 18.7, pinned by digest so a retagged image can't change what runs.
    image: postgres:18-alpine@sha256:1018733457011bf88d81db98cf43aac6d5150afc18787dbe204771fedf80ff95
    user: "70:70"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    environment:
      POSTGRES_PASSWORD: ${DB_SUPERUSER_PASSWORD:?set DB_SUPERUSER_PASSWORD in .env}
      DB_MIGRATOR_PASSWORD: ${DB_MIGRATOR_PASSWORD:?set DB_MIGRATOR_PASSWORD in .env}
      DB_RUNTIME_PASSWORD: ${DB_RUNTIME_PASSWORD:?set DB_RUNTIME_PASSWORD in .env}
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256 --auth-local=scram-sha-256
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./infra/postgres/initdb:/docker-entrypoint-initdb.d:ro
    tmpfs:
      - /var/run/postgresql
      - /tmp
    networks: [private]
    healthcheck:
      # Over TCP: during first-run setup the server listens only on its socket, so a
      # socket check would report ready before the roles exist.
      test: [CMD, pg_isready, --host=127.0.0.1, --username=postgres, --dbname=incidentpilot]
      interval: 2s
      timeout: 3s
      retries: 30

networks:
  private:
    internal: true

volumes:
  postgres-data:
