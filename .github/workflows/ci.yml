name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.7"
          enable-cache: false

      - name: Install locked toolchain
        run: make sync

      - name: Confirm the network is disabled
        run: |
          if sudo unshare --net curl --silent --max-time 5 https://pypi.org/simple/ > /dev/null; then
            echo "Network is still reachable"
            exit 1
          fi

      - name: Run make check with the network disabled
        run: >
          sudo --preserve-env
          unshare --net --setuid "$(id -u)" --setgid "$(id -g)"
          env "PATH=$PATH" "HOME=$HOME"
          make check
